<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <!-- Background Wooden Texture Gradient -->
    <linearGradient id="vlWoodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D2415"/>
      <stop offset="35%" stop-color="#5C361F"/>
      <stop offset="70%" stop-color="#442817"/>
      <stop offset="100%" stop-color="#24140B"/>
    </linearGradient>

    <!-- Brass / Gold Metallic Gradients -->
    <linearGradient id="vlBrassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CE"/>
      <stop offset="25%" stop-color="#E5B57A"/>
      <stop offset="50%" stop-color="#D49746"/>
      <stop offset="75%" stop-color="#FFCC00"/>
      <stop offset="100%" stop-color="#8C5824"/>
    </linearGradient>

    <linearGradient id="vlTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAF8F5"/>
      <stop offset="60%" stop-color="#FCEBD4"/>
      <stop offset="100%" stop-color="#E5B57A"/>
    </linearGradient>

    <linearGradient id="vlLockCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0F08"/>
      <stop offset="100%" stop-color="#2D1A0E"/>
    </linearGradient>

    <filter id="vlShadow" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <filter id="vlGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#FFCC00" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Left: Icon Mark -->
  <g transform="translate(8, 8)">
    <!-- Wooden Squircle Plaque -->
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#vlWoodGrad)" stroke="#B48248" stroke-width="1.8" filter="url(#vlShadow)"/>

    <!-- Wood Seams -->
    <line x1="2" y1="23" x2="62" y2="23" stroke="#1F1109" stroke-width="1.2" opacity="0.6"/>
    <line x1="2" y1="42" x2="62" y2="42" stroke="#1F1109" stroke-width="1.2" opacity="0.6"/>

    <!-- Brass Inner Border -->
    <rect x="4" y="4" width="56" height="56" rx="12" fill="none" stroke="url(#vlBrassGrad)" stroke-width="0.9" stroke-opacity="0.7"/>

    <!-- Corner Rivets -->
    <circle cx="8" cy="8" r="1.5" fill="#FFE2A8"/>
    <circle cx="56" cy="8" r="1.5" fill="#FFE2A8"/>
    <circle cx="8" cy="56" r="1.5" fill="#FFE2A8"/>
    <circle cx="56" cy="56" r="1.5" fill="#FFE2A8"/>

    <!-- Vault Shackle & 'V' Monogram -->
    <g filter="url(#vlGlow)">
      <path d="M23 27 C23 20 27 16 32 16 C37 16 41 20 41 27" 
            stroke="url(#vlBrassGrad)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
      
      <path d="M18 24 L29 48 C30 50 34 50 35 48 L46 24" 
            stroke="url(#vlBrassGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <!-- Keyhole Center -->
      <circle cx="32" cy="32" r="7.5" fill="url(#vlLockCore)" stroke="url(#vlBrassGrad)" stroke-width="1.4"/>
      <circle cx="32" cy="30.5" r="2" fill="#FFDF80"/>
      <polygon points="30.8,31 33.2,31 32.7,35 31.3,35" fill="#FFDF80"/>
    </g>
  </g>

  <!-- Right: Typography -->
  <g transform="translate(86, 0)">
    <!-- Brand Title: VAULTRA -->
    <text x="0" y="44" 
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" 
          font-size="31" 
          font-weight="800" 
          letter-spacing="2.5" 
          fill="url(#vlTextGrad)"
          filter="url(#vlShadow)">
      VAULTRA
    </text>

    <!-- Subtitle & Woodcraft Bar -->
    <g transform="translate(1, 58)">
      <!-- Left decorative dash -->
      <line x1="0" y1="2" x2="16" y2="2" stroke="url(#vlBrassGrad)" stroke-width="1.5" stroke-linecap="round"/>
      
      <!-- Tagline -->
      <text x="22" y="5" 
            font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" 
            font-size="9.5" 
            font-weight="700" 
            letter-spacing="3.2" 
            fill="#D4A373">
        WOODCRAFT VAULT
      </text>

      <!-- Right decorative dash -->
      <line x1="172" y1="2" x2="188" y2="2" stroke="url(#vlBrassGrad)" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>