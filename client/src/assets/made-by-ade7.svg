<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 32" fill="none">
  <defs>
    <linearGradient id="ade7Gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE5B4"/>
      <stop offset="50%" stop-color="#E5B57A"/>
      <stop offset="100%" stop-color="#FFCC00"/>
    </linearGradient>
    <linearGradient id="ade7Line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B48248" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFCC00" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#B48248" stop-opacity="0"/>
    </linearGradient>
    <filter id="ade7Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#FFCC00" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Left Accent Line -->
  <line x1="10" y1="16" x2="48" y2="16" stroke="url(#ade7Line)" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Left Diamond Stamp -->
  <polygon points="53,16 56,13 59,16 56,19" fill="#FFCC00" opacity="0.9"/>

  <!-- Centered Hallmark: MADE BY ADE7 -->
  <g filter="url(#ade7Glow)">
    <text x="110" y="20" 
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', sans-serif" 
          font-size="10.5" 
          font-weight="800" 
          letter-spacing="3.2" 
          text-anchor="middle" 
          fill="url(#ade7Gold)">
      MADE BY ADE7
    </text>
  </g>

  <!-- Right Diamond Stamp -->
  <polygon points="161,16 164,13 167,16 164,19" fill="#FFCC00" opacity="0.9"/>
  <!-- Right Accent Line -->
  <line x1="172" y1="16" x2="210" y2="16" stroke="url(#ade7Line)" stroke-width="1.2" stroke-linecap="round"/>
</svg>