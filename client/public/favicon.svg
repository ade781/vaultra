<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background Wooden Texture Gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3D2415"/>
      <stop offset="35%" stop-color="#5C361F"/>
      <stop offset="70%" stop-color="#442817"/>
      <stop offset="100%" stop-color="#24140B"/>
    </linearGradient>

    <!-- Brass / Gold Metallic Gradients -->
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CE"/>
      <stop offset="25%" stop-color="#E5B57A"/>
      <stop offset="50%" stop-color="#D49746"/>
      <stop offset="75%" stop-color="#FFCC00"/>
      <stop offset="100%" stop-color="#8C5824"/>
    </linearGradient>

    <linearGradient id="brassLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FFCC00" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="lockCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A0F08"/>
      <stop offset="100%" stop-color="#2D1A0E"/>
    </linearGradient>

    <radialGradient id="glowPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE494" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#FFCC00" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#FFCC00" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadowDeep" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.65"/>
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FFCC00" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 1. Wooden Outer Shield Squircle -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#woodGrad)" stroke="#B48248" stroke-width="2.5" filter="url(#shadowDeep)"/>

  <!-- 2. Inner Wooden Plank Seam Grooves -->
  <line x1="8" y1="42" x2="120" y2="42" stroke="#1F1109" stroke-width="1.8" opacity="0.6"/>
  <line x1="8" y1="43" x2="120" y2="43" stroke="#8C5824" stroke-width="0.8" opacity="0.4"/>
  <line x1="8" y1="84" x2="120" y2="84" stroke="#1F1109" stroke-width="1.8" opacity="0.6"/>
  <line x1="8" y1="85" x2="120" y2="85" stroke="#8C5824" stroke-width="0.8" opacity="0.4"/>

  <!-- 3. Brass Inlay Border -->
  <rect x="12" y="12" width="104" height="104" rx="22" fill="none" stroke="url(#brassGrad)" stroke-width="1.2" stroke-opacity="0.65"/>

  <!-- 4. Corner Brass Rivets / Screws -->
  <circle cx="18" cy="18" r="2.5" fill="#FFE2A8" stroke="#5C361F" stroke-width="0.7"/>
  <circle cx="110" cy="18" r="2.5" fill="#FFE2A8" stroke="#5C361F" stroke-width="0.7"/>
  <circle cx="18" cy="110" r="2.5" fill="#FFE2A8" stroke="#5C361F" stroke-width="0.7"/>
  <circle cx="110" cy="110" r="2.5" fill="#FFE2A8" stroke="#5C361F" stroke-width="0.7"/>

  <!-- 5. Ambient Center Glow -->
  <circle cx="64" cy="62" r="34" fill="url(#glowPulse)"/>

  <!-- 6. Monogram 'V' + Interlocking Vault Link Anchor -->
  <g filter="url(#goldGlow)">
    <!-- Outer Vault Shackle Arc (Top Half Vault) -->
    <path d="M46 54 C46 42 54 34 64 34 C74 34 82 42 82 54" 
          stroke="url(#brassGrad)" stroke-width="6.5" stroke-linecap="round" fill="none"/>

    <!-- Left Wing of 'V' -->
    <path d="M36 46 L58 92 C60 96 68 96 70 92 L92 46" 
          stroke="url(#brassGrad)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Polished Inner Bevel Stroke -->
    <path d="M37 46 L59 91 C60.5 94 67.5 94 69 91 L91 46" 
          stroke="url(#brassLight)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Central Keyhole Vault Escutcheon -->
    <circle cx="64" cy="63" r="14" fill="url(#lockCoreGrad)" stroke="url(#brassGrad)" stroke-width="2.2"/>
    
    <!-- Keyhole Slot -->
    <circle cx="64" cy="60.5" r="3.6" fill="#FFDF80"/>
    <polygon points="61.8,61.5 66.2,61.5 65.2,68.5 62.8,68.5" fill="#FFDF80"/>

    <!-- Small Brass Crossbar Rivets -->
    <circle cx="48" cy="66" r="1.8" fill="#FFF2CE"/>
    <circle cx="80" cy="66" r="1.8" fill="#FFF2CE"/>
  </g>
</svg>