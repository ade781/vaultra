  <rect x="10" y="10" width="108" height="108" rx="28" fill="url(#vaultraDarkBase)" stroke="#8C5C2E" stroke-width="2"/>
  <rect x="15" y="15" width="98" height="98" rx="23" fill="none" stroke="#F5BF4F" stroke-width="0.8" stroke-opacity="0.3"/>

