      <stop offset="0%" stop-color="#25170F"/>
      <stop offset="100%" stop-color="#120A05"/>
    </linearGradient>
    <linearGradient id="vaultraBrass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CE"/>
      <stop offset="35%" stop-color="#F5BF4F"/>
      <stop offset="100%" stop-color="#B8731F"/>
